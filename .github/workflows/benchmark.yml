name: Benchmark

# Runs the compliance benchmark and publishes the raw rows with machine
# provenance: a public log, a commit SHA, and a timestamp nobody typed by hand.
#
# It stays manual on purpose. A scheduled run that quietly repeats until a
# favourable result appears is the multiple-comparisons problem wearing a
# cron expression, and docs/PREREGISTRATION.md fixes the sample size to rule
# that out.
#
# Setup: add ANTHROPIC_API_KEY or OPENAI_API_KEY under
# Settings -> Secrets and variables -> Actions. Without one the job reports
# that it is unconfigured and stops.

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Which provider to run"
        required: true
        default: anthropic
        type: choice
        options: [anthropic, openai]
      model:
        description: "Model id, no date suffix (e.g. claude-haiku-4-5, claude-sonnet-5, gpt-5)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  bench:
    name: Run the preregistered benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Confirm a key is configured
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          case "${{ inputs.provider }}" in
            anthropic) test -n "$ANTHROPIC_API_KEY" || {
              echo "::error::ANTHROPIC_API_KEY is unset. Add it under Settings -> Secrets and variables -> Actions."
              exit 1; } ;;
            openai) test -n "$OPENAI_API_KEY" || {
              echo "::error::OPENAI_API_KEY is unset. Add it under Settings -> Secrets and variables -> Actions."
              exit 1; } ;;
          esac

      # The sample size is fixed by docs/PREREGISTRATION.md: 41 pairs, both
      # arms, 3 repeats, 246 completions. It is hard-coded rather than exposed
      # as an input, so no run can quietly extend itself until the interval
      # stops spanning zero.
      - name: Run the benchmark
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 benchmark/run.py \
            --provider "${{ inputs.provider }}" \
            --model "${{ inputs.model }}" \
            --repeat 3 \
            --temperature 0

      - name: Build the report
        run: |
          {
            echo "## Benchmark result"
            echo
            echo "Model \`${{ inputs.model }}\` via ${{ inputs.provider }}, commit \`${{ github.sha }}\`."
            echo
            python3 benchmark/report.py --by-alignment --by-checker
            echo
            echo "Read against the thresholds in [docs/PREREGISTRATION.md](../blob/${{ github.sha }}/docs/PREREGISTRATION.md)."
            echo "Check the with-default control first: a difference outside ±3pp there means"
            echo "the result is withheld rather than published."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the raw rows as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: rows-${{ inputs.provider }}-${{ github.run_id }}
          path: benchmark/results/*.jsonl
          retention-days: 90

      # Rows land on their own branch rather than main. A result reaches the
      # published table by review, which is what "committed reviewed raw
      # result" is supposed to mean.
      - name: Push the rows to a review branch
        run: |
          branch="results/${{ inputs.provider }}-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add benchmark/results/
          git commit \
            -m "Benchmark rows: ${{ inputs.model }} via ${{ inputs.provider }}" \
            -m "Generated by workflow run ${{ github.run_id }} against commit ${{ github.sha }}. Sample size fixed by docs/PREREGISTRATION.md: 41 pairs, 2 arms, 3 repeats." \
            -m "Review against the preregistered thresholds before adding any figure to docs/HONEST-NUMBERS.md. Check the with-default control group first."
          git push origin "$branch"
          echo "Rows pushed to \`$branch\`." >> "$GITHUB_STEP_SUMMARY"
